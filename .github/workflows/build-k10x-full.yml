name: Build K10x Kernel (patched, full modules)

on:
  workflow_dispatch:
    inputs:
      modules_branch:
        description: '驱动/devicetree 仓库分支'
        default: 'oppo/sm6375_u_14.0.0_k10x_5g'
        required: true
  push:
    branches:
      - main

concurrency:
  group: k10x-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      ROOT: ${{ github.workspace }}/OPPO_K10X_Source
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Fast Apt Mirror
        uses: vegardit/fast-apt-mirror.sh@v1
        with:
          fallback: 'yes'

      - name: Make Build Environment
        timeout-minutes: 25
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          sudo apt-get install -y git wget automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev squashfs-tools pngcrush \
            schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen \
            libswitch-perl policycoreutils minicom bc libc6-dev-i386 libx11-dev \
            lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 \
            ccache git-lfs gnupg imagemagick libelf-dev libncurses5-dev libsdl1.2-dev \
            rsync adb fastboot libstdc++6 python-is-python3 gcc-aarch64-linux-gnu
          mkdir -p "$CCACHE_DIR" "$ROOT/kernel"
          ccache -M 5G
          df -h /

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: ${{ env.ROOT }}/kernel/msm-5.4
          ref: main
          fetch-depth: 1
          submodules: false

      - name: Checkout Modules Source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/android_kernel_modules_and_devicetree_oppo_sm6375
          path: ${{ env.ROOT }}/temp_modules
          ref: ${{ inputs.modules_branch || 'oppo/sm6375_u_14.0.0_k10x_5g' }}
          fetch-depth: 1

      - name: Verify Touchpanel Patch
        run: |
          F="${{ env.ROOT }}/temp_modules/vendor/oplus/kernel/touchpanel/oplus_touchscreen_v2/touchpanel_common_driver.c"
          H="${{ env.ROOT }}/temp_modules/vendor/oplus/kernel/touchpanel/oplus_touchscreen_v2/touchpanel_common.h"
          echo "=== 补丁校验 ==="
          grep -c "pm_irq_disabled" "$F" "$H" || { echo "补丁未生效"; exit 1; }
          git -C "${{ env.ROOT }}/temp_modules" log --oneline -3

      - name: Checkout Submodules
        working-directory: ${{ env.ROOT }}/kernel/msm-5.4
        run: |
          git submodule init
          git submodule update --init --recursive || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-

      - name: Prepare Compiler
        run: |
          mkdir -p "$ROOT/compiler"
          cd "$ROOT/compiler"
          curl -fL "https://github.com/Rancemxn/android_kernel_oppo_sm6375/releases/download/tool-develop/linux-x86-refs_tags_android-14.0.0_r0.140-clang-r416183b.tar.gz" \
            -o clang-r416183b.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          mkdir -p clang-12.0.5
          tar -xzf clang-r416183b.tar.gz -C clang-12.0.5
          rm -f clang-r416183b.tar.gz
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3 aarch64-linux-android-9.3
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 arm-linux-androideabi-4.9
          mkdir -p "$ROOT/compiler/ccache-bin"
          cd "$ROOT/compiler/ccache-bin"
          for t in clang clang++ aarch64-linux-android-gcc aarch64-linux-android-g++ arm-linux-androideabi-gcc arm-linux-androideabi-g++; do
            ln -sf "$(which ccache)" "$t"
          done

      - name: Handle Dependencies
        working-directory: ${{ env.ROOT }}
        run: |
          mv temp_modules/vendor ./vendor
          rm -rf temp_modules
          ln -sf "$ROOT/vendor/qcom/opensource/wlan/qcacld-3.0" "$ROOT/kernel/msm-5.4/drivers/staging/qcacld-3.0"
          ln -sf "$ROOT/vendor/qcom/opensource/wlan/qca-wifi-host-cmn" "$ROOT/kernel/msm-5.4/drivers/staging/qca-wifi-host-cmn"
          ln -sf "$ROOT/vendor/qcom/opensource/wlan/fw-api" "$ROOT/kernel/msm-5.4/drivers/staging/fw-api"
          ln -sf "$ROOT/vendor/qcom/opensource/wlan/utils" "$ROOT/kernel/msm-5.4/drivers/staging/utils"
          echo 'source "drivers/staging/qcacld-3.0/Kconfig"' >> "$ROOT/kernel/msm-5.4/drivers/staging/Kconfig"
          echo 'obj-$(CONFIG_QCA_CLD_WLAN) += qcacld-3.0/' >> "$ROOT/kernel/msm-5.4/drivers/staging/Makefile"
          sed -i 's|WLAN_ROOT := drivers/staging/qcacld-3.0|WLAN_ROOT := $(srctree)/$(src)|g' \
            "$ROOT/vendor/qcom/opensource/wlan/qcacld-3.0/Kbuild"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Compile Kernel
        working-directory: ${{ env.ROOT }}/kernel/msm-5.4
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show Ccache
        if: always()
        continue-on-error: true
        run: ccache -s || true

      - name: Collect Artifacts
        if: always()
        run: |
          OUT="$ROOT/kernel/msm-5.4/out"
          echo "=== Image ==="
          ls -lh "$OUT/arch/arm64/boot/" 2>/dev/null || echo "no boot dir"
          echo "=== modules count ==="
          ls -1 "$OUT/all_modules" 2>/dev/null | wc -l || echo 0
          echo "=== kernel release ==="
          cat "$OUT/include/config/kernel.release" 2>/dev/null || echo unknown
          mkdir -p "$ROOT/dist"
          if [ -f "$OUT/arch/arm64/boot/Image" ]; then
            cp "$OUT/arch/arm64/boot/Image" "$ROOT/dist/Image"
          fi
          if [ -d "$OUT/all_modules" ]; then
            tar -C "$OUT/all_modules" -czf "$ROOT/dist/modules.tar.gz" .
          fi

      - name: Upload Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K10x-Image
          path: ${{ env.ROOT }}/dist/Image
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K10x-Modules
          path: ${{ env.ROOT }}/dist/modules.tar.gz
          if-no-files-found: warn
          retention-days: 7

